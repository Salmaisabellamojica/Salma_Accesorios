spring.application.name=salma_accesorios

# Conexion
spring.datasource.url=jdbc:postgresql://localhost:5432/salma_accesorios
spring.datasource.username=postgres
spring.datasource.password=1234

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialecto
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
app.jwt.secret=${SALMA_JWT_SECRET:salma-accesorios-local-secret-change-in-production}
app.jwt.expiration-seconds=86400

# Thymeleaf
spring.thymeleaf.cache=false

# Archivos
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=8MB
app.upload.products-dir=uploads/products
app.upload.reviews-dir=uploads/reviews
# activar SSL
server.ssl.enabled=true

# puerto
server.port=8443

# formato
server.ssl.key-store-type=PKCS12

# ubicacion
server.ssl.key-store=classpath:salma_accesorios.p12

# password
server.ssl.key-store-password=1234

# alias
server.ssl.key-alias=salma_accesorios

# Swagger / OpenAPI
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
