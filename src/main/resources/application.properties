spring.application.name=salma_accesorios

# Conexion
spring.datasource.url=jdbc:postgresql://localhost:5432/salma_accesorios
spring.datasource.username=postgres
spring.datasource.password=1234

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialecto
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
app.jwt.secret=${SALMA_JWT_SECRET:salma-accesorios-local-secret-change-in-production}
app.jwt.expiration-seconds=86400

# Thymeleaf
spring.thymeleaf.cache=false

# Archivos
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=8MB
app.upload.products-dir=uploads/products
app.upload.reviews-dir=uploads/reviews
