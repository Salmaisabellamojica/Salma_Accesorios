<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registro - Salma Accesorios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body class="auth-page">
<main class="container auth-shell wide">
    <section class="auth-card" aria-labelledby="registro-title">
        <div class="auth-accessibility" aria-label="Accesibilidad">
            <button class="icon-link accessibility-toggle" type="button" data-color-mode aria-label="Modo para daltonismo" title="Modo para daltonismo"><i class="bi bi-universal-access"></i></button>
        </div>
        <a th:href="@{/}" class="brand-link">SALMA ACCESORIOS</a>
        <h1 id="registro-title">Crear cuenta</h1>

        <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
        <form th:action="@{/registro}" th:object="${registerRequest}" method="post" class="stack-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="form-grid">
                <div>
                    <label for="firstName">Primer nombre</label>
                    <input id="firstName" th:field="*{firstName}" class="form-control" required pattern="^[A-Za-zÁÉÍÓÚáéíóúÑñ]{2,60}$" autocomplete="given-name">
                    <small th:errors="*{firstName}"></small>
                </div>
                <div>
                    <label for="secondName">Segundo nombre</label>
                    <input id="secondName" th:field="*{secondName}" class="form-control" pattern="^$|^[A-Za-zÁÉÍÓÚáéíóúÑñ]{2,60}$">
                    <small th:errors="*{secondName}"></small>
                </div>
                <div>
                    <label for="firstLastName">Primer apellido</label>
                    <input id="firstLastName" th:field="*{firstLastName}" class="form-control" required pattern="^[A-Za-zÁÉÍÓÚáéíóúÑñ]{2,60}$" autocomplete="family-name">
                    <small th:errors="*{firstLastName}"></small>
                </div>
                <div>
                    <label for="secondLastName">Segundo apellido</label>
                    <input id="secondLastName" th:field="*{secondLastName}" class="form-control" required pattern="^[A-Za-zÁÉÍÓÚáéíóúÑñ]{2,60}$">
                    <small th:errors="*{secondLastName}"></small>
                </div>
                <div>
                    <label for="email">Correo</label>
                    <input id="email" type="email" th:field="*{email}" class="form-control" required autocomplete="email">
                    <small th:errors="*{email}"></small>
                </div>
                <div>
                    <label for="phone">Celular colombiano</label>
                    <input id="phone" th:field="*{phone}" class="form-control" required pattern="^3\d{9}$" inputmode="numeric" autocomplete="tel">
                    <small th:errors="*{phone}"></small>
                </div>
                <div>
                    <label for="username">Usuario</label>
                    <input id="username" th:field="*{username}" class="form-control" required pattern="^[A-Za-z0-9._-]{4,40}$" autocomplete="username">
                    <small th:errors="*{username}"></small>
                </div>
                <div>
                    <label for="city">Ciudad</label>
                    <input id="city" th:field="*{city}" class="form-control" required pattern="^[A-Za-zÁÉÍÓÚáéíóúÑñ ]{2,80}$" autocomplete="address-level2">
                    <small th:errors="*{city}"></small>
                </div>
            </div>

            <label for="address">Dirección</label>
            <input id="address" th:field="*{address}" class="form-control" required pattern="^[A-Za-z0-9ÁÉÍÓÚáéíóúÑñ#.,\- ]{8,160}$" autocomplete="street-address">
            <small th:errors="*{address}"></small>

            <div class="form-grid">
                <div>
                    <label for="password">Contraseña segura</label>
                    <input id="password" type="password" th:field="*{password}" class="form-control" required minlength="8"
                           pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&.#_-])[A-Za-z\d@$!%*?&.#_-]{8,64}$" autocomplete="new-password">
                    <small>Mínimo 8 caracteres, mayúscula, minúscula, número y símbolo.</small>
                </div>
                <div>
                    <label for="confirmPassword">Confirmar contraseña</label>
                    <input id="confirmPassword" type="password" th:field="*{confirmPassword}" class="form-control" required autocomplete="new-password">
                    <small th:errors="*{confirmPassword}"></small>
                </div>
            </div>

            <button class="btn btn-dark w-100" type="submit">Crear cuenta</button>
        </form>

        <p class="text-center mt-3">¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión</a></p>
    </section>
</main>
<script th:src="@{/js/funcionesjs.js}"></script>
</body>
</html>
