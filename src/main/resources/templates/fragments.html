<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="adminHeader" class="site-header compact admin-topbar">
    <a th:href="@{/admin}" class="brand-title">SALMA ACCESORIOS</a>
    <p class="welcome-copy" th:if="${currentUser != null}" th:text="'Bienvenid@ admin ' + ${currentUser.firstName}">Bienvenid@ admin Salma</p>
    <nav class="admin-nav" aria-label="Administración">
        <a th:href="@{/admin}">Panel inicial</a>
        <a th:href="@{/admin/productos}">Productos</a>
        <a th:href="@{/admin/productos/nuevo}">Crear producto</a>
        <a th:href="@{/admin/usuarios}">Usuarios</a>
        <a th:href="@{/admin/pedidos}">Pedidos</a>
        <a th:href="@{/admin/resenas}">Reseñas</a>
        <a th:href="@{/catalogo}">Ver tienda</a>
    </nav>
    <form th:action="@{/logout}" method="post" class="logout-inline">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button type="submit">Cerrar sesión</button>
    </form>
</header>

<header th:fragment="clientHeader" class="site-header compact client-topbar">
    <a th:href="@{/}" class="brand-title">SALMA ACCESORIOS</a>
    <p class="welcome-copy" th:if="${currentUser != null}" th:text="'Bienvenid@ ' + ${currentUser.username}">Bienvenid@ cliente</p>
    <nav class="admin-nav" aria-label="Cuenta cliente">
        <a th:href="@{/}">Inicio</a>
        <a th:href="@{/catalogo}">Catálogo</a>
        <a th:href="@{/carrito}">Carrito</a>
        <a th:href="@{/pedidos}">Mis pedidos</a>
        <a th:href="@{/favoritos}">Favoritos</a>
    </nav>
    <form th:action="@{/logout}" method="post" class="logout-inline">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button type="submit">Cerrar sesión</button>
    </form>
</header>
</body>
</html>
