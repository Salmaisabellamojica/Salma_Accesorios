<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mis pedidos - Salma Accesorios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<header th:replace="~{fragments :: clientHeader}"></header>
<main class="content-section">
    <div class="section-heading">
        <div>
            <p class="eyebrow">Cuenta</p>
            <h1>Mis pedidos</h1>
        </div>
        <a class="btn btn-outline-dark" th:href="@{/catalogo}">Comprar de nuevo</a>
    </div>

    <div class="order-list" th:if="${!orders.isEmpty()}">
        <article class="order-card" th:each="order : ${orders}">
            <div>
                <h2 th:text="'Pedido #' + ${order.id}">Pedido #1</h2>
                <p><span class="status-pill" th:text="${order.status}">PENDIENTE</span></p>
            </div>
            <strong th:text="${@money.cop(order.total)}">$0</strong>
            <p th:text="${#temporals.format(order.createdAt, 'dd/MM/yyyy HH:mm')}">Fecha</p>
        </article>
    </div>

    <p th:if="${orders.isEmpty()}" class="empty-state">Aún no tienes pedidos. Explora el catálogo y guarda tus accesorios favoritos.</p>
</main>
</body>
</html>
