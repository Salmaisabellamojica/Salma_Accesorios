<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Confirmar pago - Salma Accesorios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<header th:replace="~{fragments :: clientHeader}"></header>
<main class="content-section narrow">
    <section class="payment-panel confirm-panel">
        <p class="eyebrow">Confirmacion</p>
        <h1>¿Deseas realizar este pago?</h1>
        <p th:if="${paymentRequest.paymentMethod == 'card'}">Se cobrara con la tarjeta <strong th:text="${maskedCard}">****</strong>.</p>
        <p th:if="${paymentRequest.paymentMethod != 'card'}" th:text="${'Metodo seleccionado: ' + paymentRequest.paymentMethod}">Metodo</p>
        <ul class="order-items">
            <li th:each="line : ${lines}">
                <span th:text="${line.name()}">Producto</span>
                <small th:text="${'x' + line.quantity() + ' - ' + @money.cop(line.lineTotal())}">x1</small>
            </li>
        </ul>
        <div class="payment-total-line"><span>Subtotal</span><strong th:text="${@money.cop(subtotal)}">$0</strong></div>
        <div class="payment-total-line"><span>Envio</span><strong th:text="${shippingCost.signum() == 0 ? 'Gratis' : @money.cop(shippingCost)}">Gratis</strong></div>
        <div class="payment-total"><span>Total a pagar</span><strong th:text="${@money.cop(total)}">$0</strong></div>
        <form th:action="${paymentAction + '/confirmar'}" th:object="${paymentRequest}" method="post" class="confirm-actions">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <input type="hidden" th:field="*{paymentMethod}">
            <input type="hidden" th:field="*{customerName}">
            <input type="hidden" th:field="*{customerEmail}">
            <input type="hidden" th:field="*{customerPhone}">
            <input type="hidden" th:field="*{shippingAddress}">
            <input type="hidden" th:field="*{city}">
            <input type="hidden" th:field="*{notes}">
            <input type="hidden" th:field="*{cardName}">
            <input type="hidden" th:field="*{cardNumber}">
            <input type="hidden" th:field="*{expiry}">
            <input type="hidden" th:field="*{cvv}">
            <input type="hidden" th:field="*{walletPhone}">
            <input type="hidden" th:field="*{bank}">
            <a class="btn btn-outline-dark" th:href="${paymentAction}">Corregir datos</a>
            <button class="btn btn-dark" type="submit"><i class="bi bi-check2-circle"></i> Confirmar pago</button>
        </form>
    </section>
</main>
</body>
</html>
