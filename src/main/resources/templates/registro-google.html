<!doctype html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{register.google_title} + ' - Salma Accesorios'">Completar registro con Google - Salma Accesorios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body class="auth-page">
<main class="container auth-shell wide">
    <section class="auth-card" aria-labelledby="google-registro-title">
        <a th:href="@{/}" class="home-icon-link" th:aria-label="#{login.home}" th:title="#{login.home}">
            <i class="bi bi-house-door"></i>
        </a>
        <a th:href="@{/}" class="brand-link">SALMA ACCESORIOS</a>
        <h1 id="google-registro-title" th:text="#{register.google_title}">Completar registro con Google</h1>
        <p class="auth-hint" th:text="#{register.google_intro}">Google ya confirmó tu correo. Completa los datos faltantes para crear tu cuenta.</p>
        <p class="oauth-email"><i class="bi bi-google"></i> <span th:text="${googleEmail}">correo@gmail.com</span></p>

        <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

        <form th:action="@{/registro/google/completar}" th:object="${googleRegistrationRequest}" method="post" class="stack-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="form-grid">
                <div>
                    <label for="firstName" th:text="#{register.first_name}">Primer nombre</label>
                    <input id="firstName" th:field="*{firstName}" class="form-control" required pattern="^[A-Za-zÁÉÍÓÚáéíóúÑñ]{2,60}$" autocomplete="given-name">
                    <small th:errors="*{firstName}"></small>
                </div>
                <div>
                    <label for="secondName" th:text="#{register.second_name}">Segundo nombre</label>
                    <input id="secondName" th:field="*{secondName}" class="form-control" pattern="^$|^[A-Za-zÁÉÍÓÚáéíóúÑñ]{2,60}$">
                    <small th:errors="*{secondName}"></small>
                </div>
                <div>
                    <label for="firstLastName" th:text="#{register.first_last_name}">Primer apellido</label>
                    <input id="firstLastName" th:field="*{firstLastName}" class="form-control" required pattern="^[A-Za-zÁÉÍÓÚáéíóúÑñ]{2,60}$" autocomplete="family-name">
                    <small th:errors="*{firstLastName}"></small>
                </div>
                <div>
                    <label for="secondLastName" th:text="#{register.second_last_name}">Segundo apellido</label>
                    <input id="secondLastName" th:field="*{secondLastName}" class="form-control" required pattern="^[A-Za-zÁÉÍÓÚáéíóúÑñ]{2,60}$">
                    <small th:errors="*{secondLastName}"></small>
                </div>
                <div>
                    <label for="phone" th:text="#{register.phone}">Celular colombiano</label>
                    <input id="phone" th:field="*{phone}" class="form-control" required pattern="^3\d{9}$" inputmode="numeric" autocomplete="tel">
                    <small th:errors="*{phone}"></small>
                </div>
                <div>
                    <label for="username" th:text="#{register.username}">Usuario</label>
                    <input id="username" th:field="*{username}" class="form-control" required pattern="^[A-Za-z0-9._-]{4,40}$" autocomplete="username">
                    <small th:errors="*{username}"></small>
                </div>
                <div>
                    <label for="city" th:text="#{register.city}">Ciudad</label>
                    <input id="city" th:field="*{city}" class="form-control" required pattern="^[A-Za-zÁÉÍÓÚáéíóúÑñ ]{2,80}$" autocomplete="address-level2">
                    <small th:errors="*{city}"></small>
                </div>
                <div>
                    <label for="address" th:text="#{register.address}">Dirección</label>
                    <input id="address" th:field="*{address}" class="form-control" required pattern="^[A-Za-z0-9ÁÉÍÓÚáéíóúÑñ#.,\- ]{8,160}$" autocomplete="street-address">
                    <small th:errors="*{address}"></small>
                </div>
            </div>

            <button class="btn btn-dark w-100" type="submit" th:text="#{register.finish}">Finalizar registro</button>
        </form>

        <div th:replace="~{fragments :: languageSelector}"></div>
    </section>
</main>
</body>
</html>
