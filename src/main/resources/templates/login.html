<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión - Salma Accesorios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body class="auth-page">
<main class="container auth-shell">
    <section class="auth-card" aria-labelledby="login-title">
        <a th:href="@{/}" class="brand-link">SALMA ACCESORIOS</a>
        <h1 id="login-title">Iniciar sesión</h1>

        <div class="alert alert-danger" th:if="${param.error}">No encontramos una cuenta con esos datos o la contraseña es incorrecta.</div>
        <div class="alert alert-success" th:if="${param.logout}">Sesión cerrada correctamente.</div>
        <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>

        <form th:action="@{/login}" method="post" class="stack-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <label for="email">Correo</label>
            <input id="email" type="email" name="email" class="form-control" autocomplete="email" required>

            <label for="password">Contraseña</label>
            <input id="password" type="password" name="password" class="form-control" autocomplete="current-password" required minlength="8">

            <button class="btn btn-dark w-100" type="submit">Entrar</button>
        </form>

        <p class="text-center mt-3">¿No tienes una cuenta? <a th:href="@{/registro}">Regístrate aquí</a></p>
    </section>
</main>
</body>
</html>
