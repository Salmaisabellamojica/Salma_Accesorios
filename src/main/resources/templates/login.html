<!doctype html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{login.title} + ' - Salma Accesorios'">Iniciar sesión - Salma Accesorios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body class="auth-page">
<main class="container auth-shell">
    <section class="auth-card" aria-labelledby="login-title">
        <a th:href="@{/}" class="home-icon-link" th:aria-label="#{login.home}" th:title="#{login.home}">
            <i class="bi bi-house-door"></i>
        </a>
        <div class="auth-accessibility" aria-label="Accesibilidad">
            <button class="icon-link accessibility-toggle" type="button" data-color-mode aria-label="Modo para daltonismo" title="Modo para daltonismo"><i class="bi bi-universal-access"></i></button>
        </div>
        <a th:href="@{/}" class="brand-link">SALMA ACCESORIOS</a>
        <h1 id="login-title" th:text="#{login.title}">Iniciar sesión</h1>

        <div class="alert alert-danger" th:if="${param.error}" th:text="#{login.error}">No encontramos una cuenta con esos datos o la contraseña es incorrecta.</div>
        <div class="alert alert-success" th:if="${param.logout}" th:text="#{login.logout}">Sesión cerrada correctamente.</div>
        <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>

        <form th:action="@{/login}" method="post" class="stack-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <label for="email" th:text="#{login.email}">Correo</label>
            <input id="email" type="email" name="email" class="form-control" autocomplete="email" required>

            <label for="password" th:text="#{login.password}">Contraseña</label>
            <input id="password" type="password" name="password" class="form-control" autocomplete="current-password" required minlength="8">

            <button class="btn btn-dark w-100" type="submit" th:text="#{login.submit}">Entrar</button>
        </form>

        <a class="btn google-login-btn w-100" th:href="@{/oauth2/authorization/google}">
            <span class="google-mark">G</span>
            <span th:text="#{login.google}">Continuar con Google</span>
        </a>

        <div th:replace="~{fragments :: languageSelector}"></div>

        <p class="text-center mt-3">
            <span th:text="#{login.no_account}">¿No tienes una cuenta?</span>
            <a th:href="@{/registro}" th:text="#{login.register}">Regístrate aquí</a>
        </p>
    </section>
</main>
<script th:src="@{/js/funcionesjs.js}"></script>
</body>
</html>
