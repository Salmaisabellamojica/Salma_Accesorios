<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Devoluciones - Salma Accesorios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<header th:replace="~{fragments :: clientHeader}"></header>
<main class="content-section">
    <div class="section-heading">
        <div>
            <p class="eyebrow" th:text="#{client.support}">Soporte</p>
            <h1 th:text="#{nav.returns}">Devoluciones</h1>
        </div>
        <a class="btn btn-outline-dark" th:href="@{/pedidos}" th:text="#{client.orders.view}">Ver mis pedidos</a>
    </div>

    <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <section class="return-panel">
        <h2 th:text="#{client.returns.request}">Solicitar devolucion</h2>
        <form th:action="@{/devoluciones}" method="post" class="return-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <label for="orderId" th:text="#{common.order}">Pedido</label>
            <select id="orderId" name="orderId" class="form-select" required>
                <option value="" th:text="#{client.returns.select_order}">Selecciona un pedido</option>
                <option th:each="order : ${orders}"
                        th:value="${order.id}"
                        th:selected="${selectedOrderId != null && selectedOrderId == order.id}"
                        th:text="${'Pedido #' + order.id + ' - ' + @money.cop(order.total)}">Pedido</option>
            </select>
            <label for="reason" th:text="#{common.reason}">Motivo</label>
            <textarea id="reason" name="reason" class="form-control" rows="4" maxlength="500" required
                      placeholder="Cuentanos que producto deseas devolver y por que."></textarea>
            <button class="btn btn-dark" type="submit" th:text="#{client.returns.submit}">Enviar solicitud</button>
        </form>
    </section>

    <section class="orders-list">
        <h2 th:text="#{client.returns.my_requests}">Mis solicitudes</h2>
        <article class="order-card" th:each="request : ${returns}">
            <div>
                <h3 th:text="${'Devolucion #' + request.id + ' - Pedido #' + request.order.id}">Devolucion</h3>
                <span class="status-pill" th:text="${request.status}">SOLICITADA</span>
                <p class="shipping-note success" th:if="${request.status.name() == 'APROBADA'}"
                   th:text="${'Solicitud aprobada. Nos estaremos comunicando contigo desde el numero 3212292317 al numero registrado ' + request.user.phone + ' para coordinar la devolucion.'}">
                    Solicitud aprobada.
                </p>
                <p th:text="${request.reason}">Motivo</p>
                <ul class="order-items">
                    <li th:each="item : ${request.order.items}">
                        <span th:text="${item.product.name}">Producto</span>
                        <small th:text="${'x ' + item.quantity}">x 1</small>
                    </li>
                </ul>
            </div>
            <time th:text="${#temporals.format(request.createdAt, 'dd/MM/yyyy HH:mm')}">fecha</time>
        </article>
        <p th:if="${returns.isEmpty()}" class="empty-state" th:text="#{client.returns.empty}">Aun no tienes solicitudes de devolucion.</p>
    </section>
</main>
</body>
</html>
