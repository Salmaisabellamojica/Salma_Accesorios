<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Usuarios - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<header th:replace="~{fragments :: adminHeader}"></header>
<main class="content-section">
    <div class="section-heading">
        <div>
            <p class="eyebrow">Comunidad</p>
            <h1>Usuarios</h1>
        </div>
        <a class="btn btn-outline-dark" th:href="@{/admin}">Volver al panel</a>
    </div>
    <div class="table-card">
        <table class="table">
            <thead><tr><th>Nombre</th><th>Correo</th><th>Usuario</th><th>Rol</th><th>Ciudad</th></tr></thead>
            <tbody>
            <tr th:each="user : ${users}">
                <td th:text="${user.firstName + ' ' + user.firstLastName}">Nombre</td>
                <td th:text="${user.email}">correo</td>
                <td th:text="${user.username}">usuario</td>
                <td><span class="status-pill" th:text="${user.role}">CLIENTE</span></td>
                <td th:text="${user.city.name}">Ciudad</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
