<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Usuarios - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<header th:replace="~{fragments :: adminHeader}"></header>
<main class="content-section">
    <div class="section-heading">
        <div>
            <p class="eyebrow" th:text="#{client.community}">Comunidad</p>
            <h1 th:text="#{admin.nav.users}">Usuarios</h1>
        </div>
        <a class="btn btn-outline-dark" th:href="@{/admin}" th:text="#{admin.back}">Volver al panel</a>
    </div>
    <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
    <form th:action="@{/admin/usuarios}" method="get" class="admin-search-form" role="search">
        <label for="q" th:text="#{admin.users.search}">Buscar usuario</label>
        <input id="q" name="q" th:value="${q}" class="form-control" th:placeholder="#{admin.users.placeholder}">
        <button class="btn btn-dark" type="submit" th:text="#{common.search}">Buscar</button>
        <a class="btn btn-outline-dark" th:href="@{/admin/usuarios}" th:text="#{common.clear}">Limpiar</a>
    </form>
    <div class="table-card">
        <table class="table">
            <thead><tr><th th:text="#{common.name}">Nombre</th><th th:text="#{common.email}">Correo</th><th th:text="#{common.username}">Usuario</th><th th:text="#{common.role}">Rol</th><th th:text="#{common.city}">Ciudad</th></tr></thead>
            <tbody>
            <tr th:each="user : ${users}">
                <td th:text="${user.firstName + ' ' + user.firstLastName}">Nombre</td>
                <td th:text="${user.email}">correo</td>
                <td th:text="${user.username}">usuario</td>
                <td><span class="status-pill" th:text="${user.role}">CLIENTE</span></td>
                <td th:text="${user.city.name}">Ciudad</td>
            </tr>
            </tbody>
        </table>
        <p th:if="${users.isEmpty()}" class="empty-state" th:text="#{admin.users.empty}">No encontramos usuarios con esa busqueda.</p>
    </div>
</main>
</body>
</html>
