<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reseñas - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<header th:replace="~{fragments :: adminHeader}"></header>
<main class="content-section">
    <div class="section-heading">
        <div>
            <p class="eyebrow" th:text="#{admin.reviews.moderation}">Moderación</p>
            <h1 th:text="#{admin.nav.reviews}">Reseñas</h1>
        </div>
        <a class="btn btn-outline-dark" th:href="@{/admin}" th:text="#{admin.back}">Volver al panel</a>
    </div>
    <div class="table-card">
        <table class="table align-middle">
            <thead><tr><th>Producto</th><th>Usuario</th><th>Calificación</th><th>Comentario</th><th>Acción</th></tr></thead>
            <tbody>
            <tr th:each="review : ${reviews}">
                <td th:text="${review.product.name}">Producto</td>
                <td th:text="${review.user.email}">correo</td>
                <td th:text="${review.rating}">5</td>
                <td th:text="${review.comment}">Comentario</td>
                <td>
                    <form th:action="@{/admin/resenas/{id}/eliminar(id=${review.id})}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button class="btn btn-outline-danger btn-sm" type="submit" th:text="#{common.delete}">Eliminar</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
        <p th:if="${reviews.isEmpty()}" class="empty-state">Aún no hay reseñas por moderar.</p>
    </div>
</main>
</body>
</html>
