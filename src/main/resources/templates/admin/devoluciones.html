<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Devoluciones - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<header th:replace="~{fragments :: adminHeader}"></header>
<main class="content-section">
    <div class="section-heading">
        <div>
            <p class="eyebrow" th:text="#{client.support}">Soporte</p>
            <h1 th:text="#{admin.nav.returns}">Devoluciones</h1>
        </div>
        <a class="btn btn-outline-dark" th:href="@{/admin}" th:text="#{admin.back}">Volver al panel</a>
    </div>
    <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
    <div class="table-card">
        <table class="table align-middle">
            <thead><tr><th>ID</th><th th:text="#{common.order}">Pedido</th><th th:text="#{common.customer}">Cliente</th><th th:text="#{common.reason}">Motivo</th><th th:text="#{common.status}">Estado</th><th th:text="#{common.update}">Actualizar</th></tr></thead>
            <tbody>
            <tr th:each="request : ${returns}">
                <td th:text="${request.id}">1</td>
                <td th:text="${'#' + request.order.id}">#1</td>
                <td th:text="${request.user.email}">correo</td>
                <td th:text="${request.reason}">Motivo</td>
                <td><span class="status-pill" th:text="${request.status}">SOLICITADA</span></td>
                <td>
                    <form th:action="@{/admin/devoluciones/{id}/estado(id=${request.id})}" method="post" class="inline-form">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <select name="status" class="form-select">
                            <option th:each="status : ${allowedStatusesByReturn[request.id]}" th:value="${status}" th:text="${status}" th:selected="${status == request.status}"></option>
                        </select>
                        <button class="btn btn-dark btn-sm" type="submit" th:text="#{common.save}">Guardar</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
        <p th:if="${returns.isEmpty()}" class="empty-state" th:text="#{admin.returns.empty}">Aun no hay solicitudes de devolucion.</p>
    </div>
</main>
</body>
</html>
