<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Productos - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<header th:replace="~{fragments :: adminHeader}"></header>
<main class="content-section">
    <div class="section-heading">
        <div>
            <p class="eyebrow" th:text="#{admin.products.inventory}">Inventario</p>
            <h1 th:text="#{admin.nav.products}">Productos</h1>
        </div>
        <div class="button-row">
            <a class="btn btn-outline-dark" th:href="@{/admin}" th:text="#{admin.back}">Volver al panel</a>
            <a class="btn btn-dark" th:href="@{/admin/productos/nuevo}" th:text="#{admin.products.new}">Nuevo producto</a>
        </div>
    </div>
    <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
    <form th:action="@{/admin/productos}" method="get" class="admin-search-form product-filter-form" role="search">
        <div class="filter-field">
            <label for="q" th:text="#{admin.products.search}">Buscar producto</label>
            <input id="q" name="q" th:value="${q}" class="form-control" placeholder="Nombre o descripción">
        </div>
        <div class="filter-field">
            <label for="categoryId" th:text="#{catalog.category}">Categoría</label>
            <select id="categoryId" name="categoryId" class="form-select">
                <option value="">Todas las categorías</option>
                <option th:each="category : ${categories}"
                        th:value="${category.id}"
                        th:selected="${selectedCategoryId != null && selectedCategoryId == category.id}"
                        th:text="${category.name}">Categoría</option>
            </select>
        </div>
        <button class="btn btn-dark" type="submit" th:text="#{catalog.filter}">Filtrar</button>
        <a class="btn btn-outline-dark" th:href="@{/admin/productos}" th:text="#{common.clear}">Limpiar</a>
    </form>
    <div class="table-card">
        <table class="table align-middle">
            <thead><tr><th>Nombre</th><th>Categoría</th><th>Precio</th><th>Stock</th><th>Estado</th><th>Acciones</th></tr></thead>
            <tbody>
            <tr th:each="product : ${products}">
                <td th:text="${product.name}">Producto</td>
                <td><span class="status-pill" th:text="${product.category.name}">Categoría</span></td>
                <td th:text="${@money.cop(product.price)}">$0</td>
                <td th:text="${product.stock}">0</td>
                <td th:text="${product.available ? 'Disponible' : 'Agotado'}">Disponible</td>
                <td class="table-actions">
                    <a class="btn btn-outline-dark btn-sm" th:href="@{/producto/{id}(id=${product.id})}" th:text="#{common.view}">Ver</a>
                    <a class="btn btn-outline-dark btn-sm" th:href="@{/admin/productos/{id}/editar(id=${product.id})}" th:text="#{common.edit}">Editar</a>
                    <form th:action="@{/admin/productos/{id}/eliminar(id=${product.id})}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button class="btn btn-outline-danger btn-sm" type="submit" th:text="#{common.delete}">Eliminar</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
        <p th:if="${products.isEmpty()}" class="empty-state" th:text="#{admin.products.empty}">No hay productos activos.</p>
    </div>
</main>
</body>
</html>
