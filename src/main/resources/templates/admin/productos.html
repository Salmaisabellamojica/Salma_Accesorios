<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Productos - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<header th:replace="~{fragments :: adminHeader}"></header>
<main class="content-section">
    <div class="section-heading">
        <div>
            <p class="eyebrow">Inventario</p>
            <h1>Productos</h1>
        </div>
        <a class="btn btn-dark" th:href="@{/admin/productos/nuevo}">Nuevo producto</a>
    </div>
    <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
    <div class="table-card">
        <table class="table align-middle">
            <thead><tr><th>Nombre</th><th>Precio</th><th>Stock</th><th>Estado</th><th>Acciones</th></tr></thead>
            <tbody>
            <tr th:each="product : ${products}">
                <td th:text="${product.name}">Producto</td>
                <td th:text="${@money.cop(product.price)}">$0</td>
                <td th:text="${product.stock}">0</td>
                <td th:text="${product.available ? 'Disponible' : 'Agotado'}">Disponible</td>
                <td class="table-actions">
                    <a class="btn btn-outline-dark btn-sm" th:href="@{/producto/{id}(id=${product.id})}">Ver</a>
                    <a class="btn btn-outline-dark btn-sm" th:href="@{/admin/productos/{id}/editar(id=${product.id})}">Editar</a>
                    <form th:action="@{/admin/productos/{id}/eliminar(id=${product.id})}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button class="btn btn-outline-danger btn-sm" type="submit">Eliminar</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
        <p th:if="${products.isEmpty()}" class="empty-state">No hay productos activos. Crea el primero para empezar el catálogo.</p>
    </div>
</main>
</body>
</html>
