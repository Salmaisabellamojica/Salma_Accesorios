<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Producto - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<header th:replace="~{fragments :: adminHeader}"></header>
<main class="content-section narrow">
    <div class="section-heading">
        <div>
            <p class="eyebrow">Inventario</p>
            <h1 th:text="${productId == null ? 'Nuevo producto' : 'Editar producto'}">Producto</h1>
        </div>
        <a class="btn btn-outline-dark" th:href="@{/admin/productos}">Volver a productos</a>
    </div>
    <form th:action="${formAction}" th:object="${productRequest}" method="post" enctype="multipart/form-data" class="stack-form admin-form">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label for="name">Nombre</label>
        <input id="name" th:field="*{name}" class="form-control" required maxlength="120">
        <small th:errors="*{name}"></small>

        <label for="description">Descripción</label>
        <textarea id="description" th:field="*{description}" class="form-control" required maxlength="1200"></textarea>
        <small th:errors="*{description}"></small>

        <div class="form-grid">
            <div>
                <label for="price">Precio en pesos colombianos</label>
                <input id="price" th:field="*{price}" type="number" min="0.01" step="0.01" class="form-control" required>
                <small th:errors="*{price}"></small>
            </div>
            <div>
                <label for="stock">Stock</label>
                <input id="stock" th:field="*{stock}" type="number" min="0" class="form-control" required>
                <small th:errors="*{stock}"></small>
            </div>
        </div>

        <label for="categoryId">Categoría</label>
        <select id="categoryId" th:field="*{categoryId}" class="form-select" required>
            <option value="">Selecciona una categoría</option>
            <option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}"></option>
        </select>
        <small th:errors="*{categoryId}"></small>

        <label for="imageFile">Imagen principal</label>
        <input id="imageFile" name="imageFile" class="form-control" type="file" accept="image/png,image/jpeg,image/webp">
        <small>Formatos permitidos: JPG, PNG o WEBP.</small>
        <small class="text-danger" th:if="${#fields.hasGlobalErrors()}" th:each="error : ${#fields.globalErrors()}" th:text="${error}"></small>
        <input th:each="imageUrl, iter : ${productRequest.imageUrls}" type="hidden" th:name="|imageUrls[${iter.index}]|" th:value="${imageUrl}">
        <div class="image-preview" th:if="${!productRequest.imageUrls.isEmpty()}">
            <span>Imagen actual</span>
            <img th:src="${productRequest.imageUrls[0]}" alt="Imagen actual del producto">
        </div>

        <div class="form-grid">
            <div class="form-check">
                <input id="featured" th:field="*{featured}" class="form-check-input" type="checkbox">
                <label for="featured" class="form-check-label">Producto destacado</label>
            </div>
            <div class="form-check">
                <input id="active" th:field="*{active}" class="form-check-input" type="checkbox">
                <label for="active" class="form-check-label">Visible en catálogo</label>
            </div>
        </div>

        <div class="form-actions">
            <button class="btn btn-dark" type="submit">Guardar producto</button>
            <a class="btn btn-outline-dark" th:href="@{/admin/productos}">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
