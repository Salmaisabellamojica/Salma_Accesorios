<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pedidos - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<header th:replace="~{fragments :: adminHeader}"></header>
<main class="content-section">
    <div class="section-heading">
        <div>
            <p class="eyebrow">Operación</p>
            <h1>Pedidos</h1>
        </div>
        <a class="btn btn-outline-dark" th:href="@{/admin}">Volver al panel</a>
    </div>
    <div class="table-card">
        <table class="table align-middle">
            <thead><tr><th>ID</th><th>Cliente</th><th>Total</th><th>Estado</th><th>Actualizar</th></tr></thead>
            <tbody>
            <tr th:each="order : ${orders}">
                <td th:text="${order.id}">1</td>
                <td th:text="${order.user.email}">correo</td>
                <td th:text="${@money.cop(order.total)}">$0</td>
                <td><span class="status-pill" th:text="${order.status}">PENDIENTE</span></td>
                <td>
                    <form th:action="@{/admin/pedidos/{id}/estado(id=${order.id})}" method="post" class="inline-form">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <select name="status" class="form-select">
                            <option th:each="status : ${statuses}" th:value="${status}" th:text="${status}" th:selected="${status == order.status}"></option>
                        </select>
                        <button class="btn btn-dark btn-sm" type="submit">Guardar</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
        <p th:if="${orders.isEmpty()}" class="empty-state">Aún no hay pedidos registrados.</p>
    </div>
</main>
</body>
</html>
