<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pedidos - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<header th:replace="~{fragments :: adminHeader}"></header>
<main class="content-section">
    <div class="section-heading">
        <div>
            <p class="eyebrow" th:text="#{admin.orders.operation}">Operación</p>
            <h1 th:text="#{admin.nav.orders}">Pedidos</h1>
        </div>
        <a class="btn btn-outline-dark" th:href="@{/admin}" th:text="#{admin.back}">Volver al panel</a>
    </div>
    <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
    <form th:action="@{/admin/pedidos}" method="get" class="admin-search-form order-filter-form">
        <label for="status" th:text="#{admin.orders.filter_status}">Ver por estado</label>
        <select id="status" name="status" class="form-select">
            <option value="" th:text="#{admin.orders.all}">Todos los pedidos</option>
            <option th:each="status : ${statuses}" th:value="${status}" th:text="${status}" th:selected="${selectedStatus == status}"></option>
        </select>
        <button class="btn btn-dark" type="submit" th:text="#{catalog.filter}">Filtrar</button>
        <a class="btn btn-outline-dark" th:href="@{/admin/pedidos}" th:text="#{common.clear}">Limpiar</a>
    </form>
    <div class="table-card">
        <table class="table align-middle">
            <thead><tr><th>ID</th><th th:text="#{common.customer}">Cliente</th><th th:text="#{admin.nav.products}">Productos</th><th>Total</th><th th:text="#{common.status}">Estado</th><th th:text="#{common.update}">Actualizar</th></tr></thead>
            <tbody>
            <tr th:each="order : ${orders}">
                <td th:text="${order.id}">1</td>
                <td th:text="${order.user.email}">correo</td>
                <td>
                    <ul class="table-list">
                        <li th:each="item : ${order.items}" th:text="${item.product.name + ' x ' + item.quantity}">Producto x 1</li>
                    </ul>
                </td>
                <td th:text="${@money.cop(order.total)}">$0</td>
                <td><span class="status-pill" th:text="${order.status}">PENDIENTE</span></td>
                <td>
                    <form th:action="@{/admin/pedidos/{id}/estado(id=${order.id})}" method="post" class="inline-form">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <input type="hidden" name="filterStatus" th:value="${selectedStatus}">
                        <select name="status" class="form-select">
                            <option th:each="status : ${allowedStatusesByOrder[order.id]}" th:value="${status}" th:text="${status}" th:selected="${status == order.status}"></option>
                        </select>
                        <button class="btn btn-dark btn-sm" type="submit" th:text="#{common.save}">Guardar</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
        <p th:if="${orders.isEmpty()}" class="empty-state" th:text="#{admin.orders.empty}">Aún no hay pedidos registrados.</p>
    </div>
</main>
</body>
</html>
