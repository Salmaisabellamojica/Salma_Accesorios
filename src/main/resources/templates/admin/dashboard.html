<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Panel administrador - Salma Accesorios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<header th:replace="~{fragments :: adminHeader}"></header>
<main class="content-section admin-panel">
    <div class="section-heading">
        <div>
            <p class="eyebrow">Administración</p>
            <h1>Panel inicial</h1>
        </div>
        <a class="btn btn-dark" th:href="@{/admin/productos/nuevo}">Crear producto</a>
    </div>

    <div class="stats-grid">
        <a th:href="@{/admin/usuarios}"><span th:text="${usersCount}">0</span><p>Usuarios registrados</p></a>
        <a th:href="@{/admin/productos}"><span th:text="${productsCount}">0</span><p>Productos activos</p></a>
        <a th:href="@{/admin/pedidos}"><span th:text="${pendingOrders}">0</span><p>Pedidos pendientes</p></a>
        <a th:href="@{/admin/pedidos}"><span th:text="${@money.cop(totalSales)}">$0</span><p>Ventas acumuladas</p></a>
    </div>

    <section class="admin-actions">
        <a th:href="@{/admin/productos}">Gestionar productos</a>
        <a th:href="@{/admin/usuarios}">Gestionar usuarios</a>
        <a th:href="@{/admin/pedidos}">Cambiar estados de pedidos</a>
        <a th:href="@{/admin/resenas}">Moderar reseñas</a>
        <a th:href="@{/catalogo}">Abrir tienda</a>
    </section>
</main>
</body>
</html>
