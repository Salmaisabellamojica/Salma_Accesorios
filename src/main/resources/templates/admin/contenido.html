<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contenido - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<header th:replace="~{fragments :: adminHeader}"></header>
<main class="content-section">
    <div class="section-heading">
        <div>
            <p class="eyebrow">Tienda</p>
            <h1 th:text="#{admin.content.title}">Editar inicio y footer</h1>
        </div>
        <a class="btn btn-outline-dark" th:href="@{/admin}" th:text="#{admin.back}">Volver al panel</a>
    </div>
    <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
    <form th:action="@{/admin/contenido}" th:object="${siteContentRequest}" method="post" enctype="multipart/form-data" class="admin-form">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="form-grid">
            <label>Texto superior
                <input th:field="*{heroEyebrow}" class="form-control" maxlength="120" required>
            </label>
            <label>Titulo principal
                <input th:field="*{heroTitle}" class="form-control" maxlength="120" required>
            </label>
            <label class="full">Descripcion
                <textarea th:field="*{heroCopy}" class="form-control" rows="3" maxlength="260" required></textarea>
            </label>
            <label>Texto del boton
                <input th:field="*{heroButtonLabel}" class="form-control" maxlength="80" required>
            </label>
            <label>URL de imagen del inicio
                <input th:field="*{heroImageUrl}" class="form-control" maxlength="500" placeholder="/uploads/productos/imagen.jpg">
            </label>
            <label class="full">Subir nueva imagen
                <input name="heroImageFile" class="form-control" type="file" accept="image/*">
            </label>
            <label>Texto de marca en footer
                <input th:field="*{footerTagline}" class="form-control" maxlength="160" required>
            </label>
            <label>Titulo categorias footer
                <input th:field="*{footerCategoriesTitle}" class="form-control" maxlength="80" required>
            </label>
            <label>Titulo contacto footer
                <input th:field="*{footerContactTitle}" class="form-control" maxlength="80" required>
            </label>
            <label>Texto WhatsApp
                <input th:field="*{whatsappText}" class="form-control" maxlength="120" required>
            </label>
            <label class="full">Link WhatsApp
                <input th:field="*{whatsappUrl}" class="form-control" maxlength="500" required>
            </label>
            <label>Texto Instagram
                <input th:field="*{instagramText}" class="form-control" maxlength="120" required>
            </label>
            <label>Link Instagram
                <input th:field="*{instagramUrl}" class="form-control" maxlength="500" required>
            </label>
            <label class="full">Texto legal / año
                <input th:field="*{footerCopyright}" class="form-control" maxlength="120" required>
            </label>
        </div>
        <div class="form-actions">
            <a class="btn btn-outline-dark" th:href="@{/}" th:text="#{admin.nav.store}">Ver tienda</a>
            <button class="btn btn-dark" type="submit" th:text="#{admin.content.save}">Guardar contenido</button>
        </div>
    </form>
</main>
</body>
</html>
