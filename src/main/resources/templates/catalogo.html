<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Catálogo - Salma Accesorios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<header class="site-header compact">
    <a th:href="@{/}" class="brand-title">SALMA ACCESORIOS</a>
    <a th:href="@{/carrito}" class="btn btn-outline-dark">Carrito</a>
</header>
<main class="content-section">
    <div class="section-heading">
        <h1>Catálogo</h1>
        <form th:action="@{/catalogo}" method="get" class="search-form">
            <label for="q" class="visually-hidden">Buscar productos</label>
            <input id="q" name="q" th:value="${q}" class="form-control" placeholder="Buscar accesorio">
            <select name="categoria" class="form-select" aria-label="Categoría">
                <option value="">Todas</option>
                <option th:each="category : ${categories}" th:value="${category.slug}" th:text="${category.name}" th:selected="${category.slug == categoria}"></option>
            </select>
            <button class="btn btn-dark" type="submit">Filtrar</button>
        </form>
    </div>
    <div class="product-grid">
        <article class="product-card" th:each="product : ${products}">
            <a th:href="@{/producto/{id}(id=${product.id})}">
                <img th:if="${!product.images.isEmpty()}" th:src="${product.images[0].imageUrl}" th:alt="${product.images[0].altText}">
                <div th:if="${product.images.isEmpty()}" class="image-placeholder">SALMA</div>
                <h2 th:text="${product.name}">Producto</h2>
                <p th:text="${@money.cop(product.price)}">$0</p>
                <span th:text="${product.available ? 'Disponible' : 'Agotado'}"></span>
            </a>
        </article>
    </div>
    <p th:if="${products.isEmpty()}" class="empty-state">No encontramos productos con esos filtros.</p>
</main>
</body>
</html>
