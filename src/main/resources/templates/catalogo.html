<!doctype html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{catalog.title} + ' - Salma Accesorios'">Catálogo - Salma Accesorios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<header th:replace="~{fragments :: storeHeader}"></header>
<main class="content-section">
    <div class="section-heading">
        <h1 th:text="#{catalog.title}">Catálogo</h1>
        <form th:action="@{/catalogo}" method="get" class="search-form">
            <label for="q" class="visually-hidden" th:text="#{catalog.search}">Buscar productos</label>
            <div class="search-field">
                <i class="bi bi-search"></i>
                <input id="q" name="q" th:value="${q}" class="form-control" th:placeholder="#{catalog.placeholder}">
            </div>
            <select name="categoria" class="form-select" th:aria-label="#{catalog.category}">
                <option value="" th:text="#{catalog.all}">Todas</option>
                <option th:each="category : ${categories}" th:value="${category.slug}" th:text="${category.name}" th:selected="${category.slug == categoria}"></option>
            </select>
            <button class="btn btn-dark" type="submit" th:text="#{catalog.filter}">Filtrar</button>
        </form>
    </div>
    <div class="product-grid">
        <article class="product-card" th:each="product : ${products}">
            <a th:href="@{/producto/{id}(id=${product.id})}">
                <video th:if="${!product.images.isEmpty() && #strings.endsWith(product.images[0].imageUrl, '.mp4')}" th:src="${product.images[0].imageUrl}" autoplay muted loop playsinline></video>
                <img th:if="${!product.images.isEmpty() && !#strings.endsWith(product.images[0].imageUrl, '.mp4')}" th:src="${product.images[0].imageUrl}" th:alt="${product.images[0].altText}">
                <div th:if="${product.images.isEmpty()}" class="image-placeholder">SALMA</div>
                <h2 th:text="${product.name}">Producto</h2>
                <p th:text="${@money.cop(product.price)}">$0</p>
                <span th:if="${product.available}" th:text="#{catalog.available}">Disponible</span>
                <span th:if="${!product.available}" th:text="#{catalog.sold_out}">Agotado</span>
            </a>
        </article>
    </div>
    <p th:if="${products.isEmpty()}" class="empty-state" th:text="#{catalog.empty}">No encontramos productos con esos filtros.</p>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
<aside th:replace="~{fragments :: cartDrawer}"></aside>
<script th:src="@{/js/funcionesjs.js}"></script>
</body>
</html>
