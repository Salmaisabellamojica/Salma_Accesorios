<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Factura - Salma Accesorios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<header th:replace="~{fragments :: clientHeader}"></header>
<main class="content-section narrow">
    <section class="invoice-card">
        <div class="invoice-head">
            <div>
                <p class="eyebrow">Factura</p>
                <h1 th:text="'Pedido #' + ${order.id}">Pedido #1</h1>
                <p th:text="${#temporals.format(issuedAt, 'dd/MM/yyyy HH:mm')}">Fecha</p>
            </div>
            <strong>SALMA ACCESORIOS</strong>
        </div>
        <ul class="invoice-lines">
            <li th:each="item : ${order.items}">
                <span th:text="${item.product.name + ' x ' + item.quantity}">Producto x 1</span>
                <strong th:text="${@money.cop(item.unitPrice, item.quantity)}">$0</strong>
            </li>
        </ul>
        <div class="payment-total-line">
            <span>Subtotal</span>
            <strong th:text="${@money.cop(subtotal)}">$0</strong>
        </div>
        <div class="payment-total-line">
            <span>Envio</span>
            <strong th:text="${order.shippingCost.signum() == 0 ? 'Gratis' : @money.cop(order.shippingCost)}">Gratis</strong>
        </div>
        <div class="payment-total">
            <span>Total pagado</span>
            <strong th:text="${@money.cop(order.total)}">$0</strong>
        </div>
        <div class="confirm-actions">
            <a class="btn btn-outline-dark" th:href="@{/pedidos}">Ver mis pedidos</a>
            <a class="btn btn-dark" th:href="@{/pago/{id}/factura.pdf(id=${order.id})}">Descargar PDF</a>
        </div>
    </section>
</main>
</body>
</html>
