<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Carrito - Salma Accesorios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<header th:replace="~{fragments :: clientHeader}"></header>
<main class="content-section">
    <div class="section-heading">
        <div>
            <p class="eyebrow">Compra</p>
            <h1>Carrito</h1>
        </div>
        <a class="btn btn-outline-dark" th:href="@{/catalogo}">Seguir comprando</a>
    </div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
    <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>

    <form th:action="@{/carrito/seleccion}" method="post" class="cart-list" th:if="${!cart.items.isEmpty()}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <article class="cart-row" th:each="item : ${cart.items}">
            <input type="checkbox" name="selectedItems" th:value="${item.id}" th:checked="${item.selected}" th:aria-label="'Seleccionar ' + ${item.product.name}">
            <div>
                <h2 th:text="${item.product.name}">Producto</h2>
                <p th:text="${item.quantity} + ' unidad(es)'">1 unidad</p>
            </div>
            <strong th:text="${@money.cop(item.product.price.multiply(T(java.math.BigDecimal).valueOf(item.quantity)))}">$0</strong>
            <button class="btn btn-outline-dark" type="submit">Actualizar selección</button>
        </article>
    </form>

    <p th:if="${cart.items.isEmpty()}" class="empty-state">Tu carrito está vacío.</p>

    <form th:action="@{/checkout}" method="post" th:if="${!cart.items.isEmpty()}" class="checkout-bar">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <p>Solo se compran los productos seleccionados. Los demás quedan guardados.</p>
        <button class="btn btn-dark" type="submit">Comprar seleccionados</button>
    </form>
</main>
</body>
</html>
